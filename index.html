<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horario de Aseo · 11 INFORMÁTICA "1"</title>
<!-- Logo de informática actualizado en el favicon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234FD1AE'/%3E%3Cpath d='M8 9l-3 3 3 3M16 9l3 3-3 3M13 7l-2 10' stroke='%231F2E2B' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2E2B;
    --ink-2:#28382F;
    --ink-3:#324841;
    --chalk:#F4F7F4;
    --chalk-dim:#C9D6CD;
    --mint:#4FD1AE;
    --mint-strong:#33B592;
    --mint-dim:rgba(79,209,174,.14);
    --amber:#E8A33D;
    --amber-dim:rgba(232,163,61,.14);
    --coral:#E8604E;
    --coral-dim:rgba(232,96,78,.14);
    --slate:#8FA39C;
    --line:rgba(244,247,244,.12);
    --line-strong:rgba(244,247,244,.22);
    --font-display:'Fraunces',serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
    --radius:14px;
    --shadow:0 20px 50px -20px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--chalk);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(79,209,174,.06), transparent 45%),
      radial-gradient(circle at 90% 80%, rgba(232,163,61,.05), transparent 40%);
    pointer-events:none;
    z-index:0;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--mint-dim);color:var(--mint);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--ink-3);border-radius:10px;}
  ::-webkit-scrollbar-track{background:transparent;}

  :focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:6px;}

  h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:-.01em;}
  p{margin:0;}
  .mono{font-family:var(--font-mono);}
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--slate);
  }

  #app{position:relative;z-index:1;min-height:100vh;}
  .hidden{display:none !important;}

  /* ---------- Botones con Transformaciones y Transiciones Mejoradas ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 18px;border-radius:10px;border:1px solid var(--line-strong);
    background:transparent;color:var(--chalk);font-size:14px;font-weight:600;
    cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1),
      box-shadow .25s ease,border-color .25s ease,color .25s ease,background-color .25s ease;
    white-space:nowrap;position:relative;overflow:hidden;
  }
  .btn::after{
    content:"";position:absolute;inset:0;background:rgba(255,255,255,.05);
    opacity:0;transition:opacity .2s ease;pointer-events:none;
  }
  .btn:hover::after{opacity:1;}
  .btn svg{transition:transform .3s cubic-bezier(.34,1.56,.64,1);width:16px;height:16px;flex-shrink:0;}
  .btn:hover{border-color:var(--mint);color:var(--mint);transform:translateY(-3px) scale(1.02);box-shadow:0 12px 25px -10px rgba(79,209,174,.35);}
  .btn:hover svg{transform:scale(1.2) rotate(-8deg);}
  .btn:active{transform:translateY(-1px) scale(.97);box-shadow:none;}
  .btn-primary{background:var(--mint);border-color:var(--mint);color:var(--ink);}
  .btn-primary:hover{background:var(--mint-strong);border-color:var(--mint-strong);color:var(--ink);box-shadow:0 14px 28px -8px rgba(79,209,174,.6);}
  .btn-danger{border-color:rgba(232,96,78,.4);color:var(--coral);}
  .btn-danger:hover{border-color:var(--coral);background:var(--coral-dim);box-shadow:0 14px 25px -10px rgba(232,96,78,.45);}
  .btn-ghost{border-color:transparent;color:var(--slate);padding:8px 10px;}
  .btn-ghost:hover{color:var(--chalk);background:var(--ink-3);box-shadow:none;transform:translateY(-2px);}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
  .btn-sm svg{width:14px;height:14px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none !important;box-shadow:none !important;}

  input[type=text],input[type=password],input[type=date],input[type=time],select,textarea{
    color-scheme: dark;
    width:100%;background:var(--ink-2);border:1px solid var(--line);
    color:var(--chalk);border-radius:10px;padding:11px 13px;font-size:14px;
    font-family:var(--font-body);transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
  }
  input::placeholder,textarea::placeholder{color:var(--slate);}
  input:focus,select:focus,textarea:focus{border-color:var(--mint);box-shadow:0 0 0 4px var(--mint-dim);transform:translateY(-1px);}
  label{font-size:12px;color:var(--slate);font-weight:600;letter-spacing:.02em;display:block;margin-bottom:6px;}
  textarea{resize:vertical;min-height:80px;font-family:var(--font-body);}

  .pass-wrap{position:relative;}
  .pass-wrap input{padding-right:42px;}
  .pass-toggle{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    background:transparent;border:none;color:var(--slate);cursor:pointer;
    padding:7px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    transition:color .2s ease,background-color .2s ease;
  }
  .pass-toggle:hover{color:var(--mint);background:var(--ink-3);}
  .pass-toggle svg{width:16px;height:16px;display:block;}

  .badge{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--font-mono);font-size:11px;font-weight:600;
    letter-spacing:.04em;text-transform:uppercase;
    padding:4px 9px;border-radius:100px;
    transition:transform .2s ease;
  }
  .badge-pendiente{background:var(--amber-dim);color:var(--amber);}
  .badge-aprobado{background:var(--mint-dim);color:var(--mint);}
  .badge-rechazado{background:var(--coral-dim);color:var(--coral);}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .badge-pendiente::before{animation:pulseAmber 1.8s ease infinite;}

  .card{
    background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);
    transition:border-color .25s ease,transform .25s ease,box-shadow .25s ease;
  }
  .card:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:0 15px 35px -15px rgba(0,0,0,.5);}
  
  .toast-wrap{position:fixed;top:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:10px;}
  .toast{
    background:var(--ink-2);border:1px solid var(--line-strong);border-left:3px solid var(--mint);
    padding:13px 16px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);
    animation:slideIn .35s cubic-bezier(.2,.9,.3,1.2);max-width:320px;
  }
  .toast.err{border-left-color:var(--coral);}
  .toast.toast-out{animation:toastOut .28s ease forwards;}
  @keyframes slideIn{from{opacity:0;transform:translateX(30px) scale(.95);}to{opacity:1;transform:translateX(0) scale(1);}}
  @keyframes toastOut{to{opacity:0;transform:translateX(25px) scale(.94);}}

  /* ---------- Animaciones y Transformaciones Globales ---------- */
  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popIn{0%{opacity:0;transform:scale(.85);}100%{opacity:1;transform:scale(1);}}
  @keyframes spinSlow{to{transform:rotate(360deg);}}
  @keyframes wobble{0%,100%{transform:rotate(3deg);}50%{transform:rotate(-6deg);}}
  @keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(79,209,174,.55);}70%{box-shadow:0 0 0 10px rgba(79,209,174,0);}100%{box-shadow:0 0 0 0 rgba(79,209,174,0);}}
  @keyframes pulseAmber{0%{box-shadow:0 0 0 0 rgba(232,163,61,.55);}70%{box-shadow:0 0 0 7px rgba(232,163,61,0);}100%{box-shadow:0 0 0 0 rgba(232,163,61,0);}}
  @keyframes checkPop{0%{transform:scale(.9);}45%{transform:scale(1.05);}100%{transform:scale(1);}}
  @keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  @keyframes techGlow{0%,100%{filter:drop-shadow(0 0 2px rgba(79,209,174,.4));}50%{filter:drop-shadow(0 0 8px rgba(79,209,174,.8));}}

  .view-enter{animation:fadeSlideIn .4s cubic-bezier(.2,.8,.3,1) both;}
  .stagger > *{animation:fadeSlideIn .4s cubic-bezier(.2,.8,.3,1) both;}
  .stagger > *:nth-child(1){animation-delay:.03s;}
  .stagger > *:nth-child(2){animation-delay:.07s;}
  .stagger > *:nth-child(3){animation-delay:.11s;}
  .stagger > *:nth-child(4){animation-delay:.15s;}
  .stagger > *:nth-child(5){animation-delay:.19s;}
  .stagger > *:nth-child(6){animation-delay:.23s;}
  .stagger > *:nth-child(n+7){animation-delay:.27s;}

  /* ---------- Logo de Informática y Ticket ---------- */
  .ticket{
    position:relative;
    background:linear-gradient(160deg,var(--ink-2),var(--ink-3));
    border:1px solid var(--line-strong);
    border-radius:18px;
    padding:24px;
    overflow:hidden;
    transition:border-color .3s ease,box-shadow .3s ease,transform .3s ease;
  }
  .ticket:hover{border-color:rgba(79,209,174,.5);box-shadow:0 20px 40px -20px rgba(0,0,0,.7);transform:translateY(-2px);}
  .ticket::after{
    content:"";position:absolute;top:-40px;right:-40px;width:150px;height:150px;
    background:radial-gradient(circle,var(--mint-dim),transparent 70%);
    animation:floatY 4.5s ease-in-out infinite;
  }
  .ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;}
  .ticket-stamp{
    font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.12em;
    color:var(--ink);background:var(--mint);padding:5px 10px;border-radius:6px;
    transform:rotate(3deg);box-shadow:0 4px 12px rgba(79,209,174,.35);
    transition:transform .3s ease;
  }
  .ticket:hover .ticket-stamp{animation:wobble .5s ease;}
  .ticket-group{font-family:var(--font-display);font-size:26px;margin-top:6px;position:relative;}
  .ticket-dots{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;position:relative;}
  .tdot{
    width:11px;height:11px;border-radius:50%;border:1.5px solid var(--chalk-dim);
    transition:.3s cubic-bezier(.34,1.56,.64,1);
  }
  .tdot.done{background:var(--mint-dim);border-color:var(--mint);}
  .tdot.current{background:var(--mint);border-color:var(--mint);box-shadow:0 0 0 5px var(--mint-dim);animation:pulseRing 2s ease infinite;}

  /* ---------- Login ---------- */
  .login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:1;
  }
  .login-box{width:100%;max-width:440px;animation:fadeSlideIn .45s cubic-bezier(.2,.8,.3,1);}
  
  /* Logo de Informática Animado */
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:34px;justify-content:center;}
  .brand-mark{
    width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg, var(--mint), var(--mint-strong));
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease;
    box-shadow:0 0 0 0 rgba(79,209,174,0);
    animation:techGlow 3s ease-in-out infinite;
  }
  .brand:hover .brand-mark{transform:rotate(-12deg) scale(1.15);box-shadow:0 12px 25px -8px rgba(79,209,174,.7);}
  .brand-mark svg { width: 26px; height: 26px; stroke: var(--ink); }
  
  .brand-text{text-align:left;}
  .brand-text h1{font-size:18px;}
  .brand-text span{font-size:11px;color:var(--slate);font-family:var(--font-mono);letter-spacing:.08em;}

  .login-card{background:var(--ink-2);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--shadow);animation:fadeSlideIn .5s cubic-bezier(.2,.8,.3,1) .06s both;}
  .tabbar{display:flex;background:var(--ink);border-radius:10px;padding:4px;margin-bottom:22px;border:1px solid var(--line);}
  .tabbar button{
    flex:1;background:transparent;border:none;color:var(--slate);padding:10px;border-radius:7px;
    font-size:13px;font-weight:600;cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);
  }
  .tabbar button.active{background:var(--ink-2);color:var(--mint);transform:scale(1.03);box-shadow:0 4px 12px rgba(0,0,0,.3);}
  .field{margin-bottom:16px;}
  .grupo-select-list{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;margin-bottom:16px;padding-right:4px;}
  .grupo-opt{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;
    transition:all .25s cubic-bezier(.34,1.56,.64,1);
    background:var(--ink);
  }
  .grupo-opt:hover{border-color:var(--mint);transform:translateX(5px) scale(1.01);background:var(--ink-3);}
  .grupo-opt.sel{border-color:var(--mint);background:var(--mint-dim);transform:translateX(4px);}
  .grupo-opt span.arrow{color:var(--slate);font-family:var(--font-mono);transition:transform .25s ease;}
  .grupo-opt:hover span.arrow{transform:translateX(4px);color:var(--mint);}
  .err-msg{color:var(--coral);font-size:13px;margin-top:10px;min-height:16px;}

  .info-badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--slate);font-family:var(--font-mono);letter-spacing:.03em;}
  .info-badge svg{width:13px;height:13px;}
  .loader-ring{
    width:44px;height:44px;border-radius:50%;margin:0 auto 16px;
    border:3px solid rgba(79,209,174,.15);border-top-color:var(--mint);
    animation:spinSlow .8s linear infinite;
  }

  /* ---------- App shell (admin) ---------- */
  .shell{display:flex;min-height:100vh;position:relative;z-index:1;}
  .sidebar{
    width:240px;flex-shrink:0;background:var(--ink-2);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;
  }
  .sidebar .brand{justify-content:flex-start;margin-bottom:26px;padding:0 8px;}
  .nav-item{
    display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;
    color:var(--slate);cursor:pointer;font-size:13.5px;font-weight:600;margin-bottom:4px;
    transition:all .25s cubic-bezier(.34,1.56,.64,1);border:1px solid transparent;
    position:relative;overflow:hidden;
  }
  .nav-item::before{
    content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--mint);
    border-radius:0 3px 3px 0;transform:scaleY(0);transition:transform .25s cubic-bezier(.34,1.56,.64,1);
    transform-origin:center;
  }
  .nav-item.active::before{transform:scaleY(1);}
  .nav-item svg{flex-shrink:0;width:18px;height:18px;transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
  .nav-item:hover{color:var(--chalk);background:var(--ink-3);transform:translateX(4px);}
  .nav-item:hover svg{transform:scale(1.2) rotate(-5deg);color:var(--mint);}
  .nav-item.active{color:var(--mint);background:var(--mint-dim);border-color:rgba(79,209,174,.3);}
  .nav-count{
    margin-left:auto;background:var(--amber);color:var(--ink);font-family:var(--font-mono);
    font-size:10px;font-weight:700;padding:2px 7px;border-radius:100px;
    animation:pulseAmber 2.2s ease infinite;
  }
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);}
  .sess-tag{font-size:12px;color:var(--slate);padding:0 8px 10px;font-family:var(--font-mono);}

  .main{flex:1;min-width:0;padding:32px 38px 60px;}
  .main-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:28px;flex-wrap:wrap;}
  .main-top h2{font-size:26px;}
  .main-top p.sub{color:var(--slate);font-size:13.5px;margin-top:4px;}
  .ticket-mini{
    display:flex;align-items:center;gap:12px;background:var(--ink-2);border:1px solid var(--line-strong);
    padding:10px 16px;border-radius:100px;transition:all .25s cubic-bezier(.34,1.56,.64,1);
  }
  .ticket-mini:hover{border-color:rgba(79,209,174,.5);transform:translateY(-2px) scale(1.02);box-shadow:0 10px 20px -10px rgba(0,0,0,.5);}
  .ticket-mini .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px var(--mint-dim);animation:pulseRing 2s ease infinite;}
  .ticket-mini b{font-family:var(--font-display);font-size:14px;}
  .ticket-mini span{font-size:11px;color:var(--slate);font-family:var(--font-mono);}

  /* ---------- Tablas / Listas ---------- */
  .report-row{
    display:grid;grid-template-columns:1fr auto;gap:16px;padding:20px;
    border:1px solid var(--line);border-radius:14px;margin-bottom:12px;background:var(--ink-2);
    align-items:start;transition:all .25s cubic-bezier(.34,1.56,.64,1);
    animation:fadeSlideIn .35s cubic-bezier(.2,.8,.3,1) both;
  }
  .report-row:hover{border-color:var(--line-strong);transform:translateY(-3px);box-shadow:0 16px 30px -18px rgba(0,0,0,.7);}
  .report-row .rmeta{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .report-row h4{font-size:15px;font-family:var(--font-body);font-weight:700;}
  .report-row .rdate{font-size:12px;color:var(--slate);font-family:var(--font-mono);}
  .task-chip{
    display:inline-flex;font-size:11.5px;background:var(--ink-3);color:var(--chalk-dim);
    padding:4px 10px;border-radius:100px;margin:2px 4px 0 0;transition:all .2s ease;
  }
  .task-chip:hover{background:var(--mint-dim);color:var(--mint);transform:translateY(-2px) scale(1.03);}
  .report-comment{font-size:13px;color:var(--slate);margin-top:9px;line-height:1.5;font-style:italic;}
  .report-actions{display:flex;flex-direction:column;gap:8px;}

  table{width:100%;border-collapse:collapse;}
  thead th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--slate);font-weight:600;padding:0 14px 12px;font-family:var(--font-mono);
  }
  tbody tr{background:var(--ink-2);transition:background-color .2s ease;}
  tbody tr:hover{background:var(--ink-3);}
  tbody td{padding:14px;font-size:13.5px;border-top:1px solid var(--line);}
  tbody tr td:first-child{border-radius:10px 0 0 10px;}
  tbody tr td:last-child{border-radius:0 10px 10px 0;}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--slate);border:1px dashed var(--line-strong);border-radius:16px;
    animation:fadeSlideIn .4s ease;
  }
  .empty-state h4{color:var(--chalk);font-size:16px;margin-bottom:6px;font-family:var(--font-display);}
  .empty-state p{font-size:13px;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:720px){.grid-2{grid-template-columns:1fr;}}

  .group-card{
    padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--ink-2);
    display:flex;flex-direction:column;gap:12px;transition:all .25s cubic-bezier(.34,1.56,.64,1);
    animation:fadeSlideIn .35s cubic-bezier(.2,.8,.3,1) both;
  }
  .group-card:hover{border-color:var(--line-strong);transform:translateY(-3px);box-shadow:0 16px 30px -18px rgba(0,0,0,.7);}
  .group-card-top{display:flex;justify-content:space-between;align-items:center;}
  .group-card-top h4{font-size:15px;font-family:var(--font-body);font-weight:700;}
  .group-card .idtag{font-family:var(--font-mono);font-size:11px;color:var(--slate);}
  .pw-row{display:flex;gap:8px;}
  .pw-row input{flex:1;}

  .checklist{display:flex;flex-direction:column;gap:10px;}
  .check-item{
    display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid var(--line);
    border-radius:12px;cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);
    background:var(--ink);
  }
  .check-item:hover{border-color:var(--line-strong);transform:translateX(4px) scale(1.01);background:var(--ink-3);}

}
function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

class SemedApp {
  constructor(config){
    this.state = {
      vista: 'cargando',
      tabAdmin: 'revisar',
      session: null,
      loginTab: 'admin',
      grupoSeleccionado: null,
      grupos: [],
      reportes: [],
      ajustes: { admin_pass: 'admin123', turno_actual: null },
      loaded:{grupos:false, reportes:false, ajustes:false},
      calFecha: { anio: new Date().getFullYear(), mes: new Date().getMonth() },
      calFechaPublico: { anio: new Date().getFullYear(), mes: new Date().getMonth() },
      modalDia: null
    };
    this.root = document.getElementById('app');
    this._unsubs = [];
    this.connError = null;

    try{
      this.firebaseApp = initializeApp(config);
      this.db = getFirestore(this.firebaseApp);
    }catch(e){
      this.connError = 'No se pudo inicializar Firebase: ' + e.message;
      this.state.vista = 'error';
      this.render();
      return;
    }
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape' && this.state.modalDia) this.cerrarModal();
    });

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.pass-toggle');
      if(!btn) return;
      const input = btn.parentElement.querySelector('input');
      if(!input) return;
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.innerHTML = showing ? ICONS.eye : ICONS.eyeOff;
      btn.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
    });

    this.init();
  }

  init(){
    this.restaurarSesion();
    this.render();
    this.escucharAjustes();
    this.escucharGrupos();
    this.escucharReportes();
    this.bootstrapAjustes();
  }

  async bootstrapAjustes(){
    try{
      const ref = doc(this.db, 'config', 'ajustes_admin');
      const snap = await getDoc(ref);
      if(!snap.exists()){
        await setDoc(ref, { admin_pass: 'admin123', turno_actual: null }, { merge:true });
      }
    }catch(e){
      this.connError = 'Error al conectar con Firestore: ' + e.message;
      this.render();
    }
  }

  escucharAjustes(){
    const ref = doc(this.db, 'config', 'ajustes_admin');
    const unsub = onSnapshot(ref, snap => {
      if(snap.exists()) this.state.ajustes = snap.data();
      this.state.loaded.ajustes = true;
      this.connError = null;
      this.render();
    }, err => {
      this.connError = 'Error leyendo ajustes (' + err.code + '): ' + err.message;
      this.toast(this.connError, true);
      this.render();
    });
    this._unsubs.push(unsub);
  }

  escucharGrupos(){
    const ref = collection(this.db, 'grupos');
    const unsub = onSnapshot(ref, snap => {
      this.state.grupos = snap.docs
        .map(d => ({ id:d.id, ...d.data() }))
        .sort((a,b) => (a.nombre||'').localeCompare(b.nombre||''));
      this.state.loaded.grupos = true;
      this.connError = null;
      this.render();
    }, err => {
      this.connError = 'Error leyendo grupos (' + err.code + '): ' + err.message;
      this.toast(this.connError, true);
      this.render();
    });
    this._unsubs.push(unsub);
  }

  escucharReportes(){
    const ref = collection(this.db, 'reportes');
    const unsub = onSnapshot(ref, snap => {
      this.state.reportes = snap.docs
        .map(d => ({ id:d.id, ...d.data() }))
        .sort((a,b) => (b.fecha?.toMillis?.() || 0) - (a.fecha?.toMillis?.() || 0));
      this.state.loaded.reportes = true;
      this.connError = null;
      this.render();
    }, err => {
      this.connError = 'Error leyendo reportes (' + err.code + '): ' + err.message;
      this.toast(this.connError, true);
      this.render();
    });
    this._unsubs.push(unsub);
  }

  restaurarSesion(){
    try{
      const raw = sessionStorage.getItem('semed_session');
      if(raw) this.state.session = JSON.parse(raw);
      this.state.vista = this.state.session
        ? (this.state.session.tipo === 'admin' ? 'admin' : 'sub')
        : 'inicio';
    }catch(e){ this.state.vista = 'inicio'; }
  }

  guardarSesion(){
    sessionStorage.setItem('semed_session', JSON.stringify(this.state.session));
  }

  logout(){
    this.state.session = null;
    this.state.vista = 'inicio';
    this.state.loginTab = 'admin';
    this.state.grupoSeleccionado = null;
    sessionStorage.removeItem('semed_session');
    this.render();
  }

  verificarLogin(tipo, data){
    if(tipo === 'admin'){
      const passActual = this.state.ajustes?.admin_pass ?? 'admin123';
      if(data.password === passActual){
        this.state.session = { tipo:'admin' };
        this.state.vista = 'admin';
        this.guardarSesion();
        this.toast('Bienvenido, Administrador/a.');
        this.render();
        return true;
      }
      this.loginError = 'Contraseña de administrador incorrecta.';
      this.render();
      return false;
    }
    if(tipo === 'grupo'){
      const grupo = this.state.grupos.find(g => g.id === data.grupoId);
      if(!grupo){ this.loginError = 'Selecciona un grupo.'; this.render(); return false; }
      if(data.password === grupo.pass){
        this.state.session = { tipo:'grupo', grupoId: grupo.id, grupoNombre: grupo.nombre };
        this.state.vista = 'sub';
        this.guardarSesion();
        this.toast(`Bienvenido/a, ${grupo.nombre}.`);
        this.render();
        return true;
      }
      this.loginError = 'Contraseña de grupo incorrecta.';
      this.render();
      return false;
    }
  }

  async cambiarPasswordAdmin(nuevaPassword){
    if(!nuevaPassword || nuevaPassword.length < 4){
      this.toast('La contraseña debe tener al menos 4 caracteres.', true);
      return;
    }
    try{
      await setDoc(doc(this.db, 'config', 'ajustes_admin'), { admin_pass: nuevaPassword }, { merge:true });
      this.toast('Contraseña de administrador actualizada.');
    }catch(e){ this.toast('No se pudo actualizar: ' + e.message, true); }
  }

  async actualizarPassGrupo(id, nuevaPassword){
    if(!nuevaPassword || nuevaPassword.length < 4){
      this.toast('La contraseña debe tener al menos 4 caracteres.', true);
      return;
    }
    try{
      await updateDoc(doc(this.db, 'grupos', id), { pass: nuevaPassword });
      this.toast('Contraseña de acceso actualizada.');
    }catch(e){ this.toast('No se pudo actualizar: ' + e.message, true); }
  }

  async crearGrupo(nombre, pass){
    if(!nombre?.trim()){ this.toast('Escribe un nombre de sección.', true); return; }
    try{
      const id = 'g_' + Date.now().toString(36);
      await setDoc(doc(this.db, 'grupos', id), {
        id, nombre: nombre.trim(), pass: pass?.trim() || '1234', integrantes: []
      });
      this.toast('Grupo creado.');
    }catch(e){ this.toast('No se pudo crear el grupo: ' + e.message, true); }
  }

  async renombrarGrupo(id, nombre){
    if(!nombre?.trim()) return;
    try{
      await updateDoc(doc(this.db, 'grupos', id), { nombre: nombre.trim() });
      this.toast('Grupo actualizado.');
    }catch(e){ this.toast('Error: ' + e.message, true); }
  }

  async eliminarGrupo(id){
    try{
      await deleteDoc(doc(this.db, 'grupos', id));
      this.toast('Grupo eliminado.');
    }catch(e){ this.toast('Error al eliminar: ' + e.message, true); }
  }

  async forzarTurno(grupoId){
    try{
      await setDoc(doc(this.db, 'config', 'ajustes_admin'), { turno_actual: grupoId }, { merge:true });
      this.toast('Turno actualizado.');
    }catch(e){ this.toast('Error: ' + e.message, true); }
  }

  async agregarIntegrante(grupoId, nombre, rol){
    if(!nombre?.trim()){ this.toast('Escribe el nombre del integrante.', true); return; }
    const grupo = this.state.grupos.find(g => g.id === grupoId);
    if(!grupo){ this.toast('Grupo no encontrado.', true); return; }
    const nuevo = {
      id: 'i_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      nombre: nombre.trim(),
      rol: rol || TAREAS_DISPONIBLES[0]
    };
    const integrantes = [...(grupo.integrantes || []), nuevo];
    try{
      await updateDoc(doc(this.db, 'grupos', grupoId), { integrantes });
      this.toast('Integrante agregado.');
    }catch(e){ this.toast('No se pudo agregar: ' + e.message, true); }
  }

  async actualizarRolIntegrante(grupoId, integranteId, nuevoRol){
    const grupo = this.state.grupos.find(g => g.id === grupoId);
    if(!grupo) return;
    const integrantes = (grupo.integrantes || []).map(i => i.id === integranteId ? { ...i, rol: nuevoRol } : i);
    try{
      await updateDoc(doc(this.db, 'grupos', grupoId), { integrantes });
      this.toast('Rol actualizado.');
    }catch(e){ this.toast('Error: ' + e.message, true); }
  }

  async eliminarIntegrante(grupoId, integranteId){
    const grupo = this.state.grupos.find(g => g.id === grupoId);
    if(!grupo) return;
    const integrantes = (grupo.integrantes || []).filter(i => i.id !== integranteId);
    try{
      await updateDoc(doc(this.db, 'grupos', grupoId), { integrantes });
      this.toast('Integrante eliminado.');
    }catch(e){ this.toast('Error: ' + e.message, true); }
  }

  async enviarReporte(grupoId, tareas, comentarios, fechaHora){
    if(!tareas.length){
      this.toast('Marca al menos una tarea realizada.', true);
      return false;
    }
    const fechaAseo = (fechaHora instanceof Date && !isNaN(fechaHora)) ? fechaHora : new Date();
    try{
      await addDoc(collection(this.db, 'reportes'), {
        grupo_id: grupoId,
        fecha: fechaAseo,
        enviado_en: serverTimestamp(),
        tareas,
        comentarios: comentarios?.trim() || '',
        estado: 'pendiente'
      });
      this.toast('Reporte enviado. Queda pendiente de revisión.');
      return true;
    }catch(e){ this.toast('No se pudo enviar el reporte: ' + e.message, true); return false; }
  }

  async aprobarReporte(id){
    try{
      await updateDoc(doc(this.db, 'reportes', id), { estado: 'aprobado' });
      this.toast('Reporte aprobado.');
    }catch(e){ this.toast('Error: ' + e.message, true); }
  }

  async rechazarReporte(id){
    try{
      await updateDoc(doc(this.db, 'reportes', id), { estado: 'rechazado' });
      this.toast('Reporte rechazado.');
    }catch(e){ this.toast('Error: ' + e.message, true); }
  }

  async limpiarHistorial(){
    const aprobados = this.state.reportes.filter(r => r.estado === 'aprobado');
    if(!aprobados.length){ this.toast('No hay historial que limpiar.'); return; }
    if(!confirm(`¿Eliminar permanentemente ${aprobados.length} reporte(s) aprobado(s) del historial?`)) return;
    try{
      await Promise.all(aprobados.map(r => deleteDoc(doc(this.db, 'reportes', r.id))));
      this.toast('Historial limpiado.');
    }catch(e){ this.toast('Error al limpiar historial: ' + e.message, true); }
  }

  toast(msg, isErr=false){
    const wrap = document.getElementById('toastWrap');
    const t = el(`<div class="toast ${isErr?'err':''}">${esc(msg)}</div>`);
    wrap.appendChild(t);
    setTimeout(() => {
      t.classList.add('toast-out');
      setTimeout(() => t.remove(), 280);
    }, 3600);
  }

  infoBadge(){
    return `<div class="info-badge">${ICONS.codeLogo}<span>11 Informática · Sistema de Aseo</span></div>`;
  }

  passField(id, placeholder){
    return `
      <div class="pass-wrap">
        <input type="password" id="${id}" placeholder="${esc(placeholder)}">
        <button type="button" class="pass-toggle" data-target="${id}" aria-label="Mostrar contraseña">${ICONS.eye}</button>
      </div>`;
  }

  render(){
    if(this.root) this.root.dataset.semedRendered = '1';
    if(this.state.vista === 'error' || (this.connError && !this.state.loaded.grupos && !this.state.loaded.ajustes && !this.state.loaded.reportes)){
      return this.renderErrorScreen();
    }
    if(this.state.vista === 'cargando'){
      this.root.innerHTML = `<div class="login-screen"><div style="text-align:center;"><div class="loader-ring"></div><p class="eyebrow">Cargando sistema…</p></div></div>`;
      return;
    }
    if(this.state.vista === 'inicio')     return this.renderInicio();
    if(this.state.vista === 'login')      return this.renderLogin();
    if(this.state.vista === 'calPublico') return this.renderCalendarioPublico();
    if(this.state.vista === 'admin')      return this.renderAdminShell();
    if(this.state.vista === 'sub')        return this.renderSubShell();
  }

  /* ---------- Turno actual / siguiente ---------- */
  turnoInfo(){
    const grupos = this.state.grupos;
    const turnoId = this.state.ajustes?.turno_actual;
    const idx = grupos.findIndex(g => g.id === turnoId);
    const actual = idx > -1 ? grupos[idx] : null;
    let siguiente = null;
    if(grupos.length){
      const siguienteIdx = idx > -1 ? (idx + 1) % grupos.length : 0;
      siguiente = grupos[siguienteIdx] || null;
      if(siguiente && actual && siguiente.id === actual.id && grupos.length === 1) siguiente = null;
    }
    return { actual, siguiente };
  }

  renderErrorScreen(){
    this.root.innerHTML = `
      <div class="login-screen">
        <div class="login-box" style="max-width:520px;">
          ${this.brandBlock()}
          <div class="login-card">
            <p class="eyebrow" style="color:var(--coral);margin-bottom:10px;">No se pudo conectar con Firebase</p>
            <p style="font-size:13.5px;color:var(--chalk-dim);line-height:1.6;margin-bottom:16px;">
              ${esc(this.connError || 'Error desconocido al conectar con la base de datos.')}
            </p>
            <div style="margin-top:18px;"><button class="btn btn-primary" id="btnReintentar" style="width:100%">${ICONS.refresh} Reintentar</button></div>
          </div>
        </div>
      </div>`;
    document.getElementById('btnReintentar').onclick = () => {
      this._unsubs.forEach(u => { try{ u(); }catch(e){} });
      this._unsubs = [];
      this.connError = null;
      this.state.vista = 'cargando';
      this.render();
      this.init();
    };
  }

  brandBlock(){
    return `
      <div class="brand">
        <div class="brand-mark">${ICONS.codeLogo}</div>
        <div class="brand-text">
          <h1>11 Informática</h1>
          <span>CONTROL DE ASEO ESCOLAR</span>
        </div>
      </div>`;
  }

  ticketBlock(compact=false){
    const grupos = this.state.grupos;
    const turnoId = this.state.ajustes?.turno_actual;
    const turno = grupos.find(g => g.id === turnoId);
    if(compact){
      return `
        <div class="ticket-mini">
          <span class="dot"></span>
          <div>
            <span>TURNO ACTUAL</span><br>
            <b>${turno ? esc(turno.nombre) : 'Sin asignar'}</b>
          </div>
        </div>`;
    }
    const idx = grupos.findIndex(g => g.id === turnoId);
    const dots = grupos.map((g,i) => {
      let cls = '';
      if(g.id === turnoId) cls = 'current';
      else if(idx > -1 && i < idx) cls = 'done';
      return `<span class="tdot ${cls}" title="${esc(g.nombre)}"></span>`;
    }).join('');
    return `
      <div class="ticket">
        <div class="ticket-top">
          <div>
            <p class="eyebrow">Turno activo de aseo</p>
            <h3 class="ticket-group">${turno ? esc(turno.nombre) : 'Sin asignar todavía'}</h3>
          </div>
          <span class="ticket-stamp">LABORATORIO</span>
        </div>
        <div class="ticket-dots">${dots || '<span class="eyebrow">Sin grupos registrados</span>'}</div>
      </div>`;
  }

  renderInicio(){
    const { actual, siguiente } = this.turnoInfo();
    this.root.innerHTML = `
      <div class="portal-page">
        <div class="portal-topbar">
          <span class="badge portal-badge">PORTAL OFICIAL</span>
          <div class="portal-actions">
            <button class="btn btn-portal" id="btnPortalSub">${ICONS.persona} Subadmin</button>
            <button class="btn btn-portal" id="btnPortalAdmin">${ICONS.key} Admin</button>
            <button class="btn btn-primary btn-portal" id="btnPortalCal">${ICONS.calendario} Ver Calendario</button>
          </div>
        </div>

        <div class="portal-hero">
          <h1>HORARIO DE ASEO</h1>
          <h2 class="portal-sub">INFORMÁTICA SEMED</h2>
        </div>

        <div class="card portal-turno-card">
          <div class="portal-turno-badge"><span class="dot-live"></span> Turno activo de aseo</div>
          <h3 class="portal-turno-actual">TURNO ACTUAL: ${actual ? `<b>${esc(actual.nombre.toUpperCase())}</b>` : 'Sin asignar todavía'}</h3>
          <p class="portal-turno-sig">
            ${siguiente
              ? `El siguiente turno de aseo le corresponderá a: <b>${esc(siguiente.nombre)}</b>`
              : (this.state.grupos.length ? 'Aún no hay un turno siguiente definido.' : 'Todavía no se han registrado secciones.')}
          </p>
        </div>

        <footer class="appfoot portal-foot">
          <div>Centro de Educación Media Gubernamental · Informática</div>
          <div style="margin-top:10px;display:flex;justify-content:center;">${this.infoBadge()}</div>
        </footer>
      </div>`;

    document.getElementById('btnPortalSub').onclick = () => {
      this.state.vista = 'login'; this.state.loginTab = 'grupo'; this.loginError = ''; this.render();
    };
    document.getElementById('btnPortalAdmin').onclick = () => {
      this.state.vista = 'login'; this.state.loginTab = 'admin'; this.loginError = ''; this.render();
    };
    document.getElementById('btnPortalCal').onclick = () => {
      this.state.vista = 'calPublico'; this.render();
    };
  }

  renderLogin(){
    const { loginTab, grupoSeleccionado, grupos } = this.state;
    this.root.innerHTML = `
      <div class="login-screen">
        <div class="login-box">
          <div style="margin-bottom:14px;">
            <button class="btn btn-ghost btn-sm" id="btnVolverPortal">${ICONS.arrowLeft} Volver al portal</button>
          </div>
          ${this.brandBlock()}
          <div class="login-card">
            <div class="tabbar">
              <button data-tab="admin" class="${loginTab==='admin'?'active':''}">Administrador</button>
              <button data-tab="grupo" class="${loginTab==='grupo'?'active':''}">Sección / Grupo</button>
            </div>
            <div id="loginBody"></div>
            <p class="err-msg">${esc(this.loginError || '')}</p>
          </div>
          <footer class="appfoot">
            <div>Centro de Educación Media Gubernamental · Informática</div>
            <div style="margin-top:10px;display:flex;justify-content:center;">${this.infoBadge()}</div>
          </footer>
        </div>
      </div>`;

    document.getElementById('btnVolverPortal').onclick = () => { this.state.vista = 'inicio'; this.loginError=''; this.render(); };

    const body = document.getElementById('loginBody');
    if(loginTab === 'admin'){
      body.innerHTML = `
        <div class="field">
          <label>Contraseña de administrador</label>
          ${this.passField('admPass', '••••••••')}
        </div>
        <button class="btn btn-primary" id="btnAdminLogin" style="width:100%">Ingresar al panel ${ICONS.arrowRight}</button>
      `;
      document.getElementById('btnAdminLogin').onclick = () => {
        this.loginError = '';
        this.verificarLogin('admin', { password: document.getElementById('admPass').value });
      };
      body.querySelector('#admPass').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('btnAdminLogin').click(); });
    } else {
      const listHtml = grupos.length
        ? grupos.map(g => `
            <div class="grupo-opt ${grupoSeleccionado===g.id?'sel':''}" data-id="${g.id}">
              <span>${esc(g.nombre)}</span><span class="arrow">→</span>
            </div>`).join('')
        : `<p class="eyebrow">Aún no hay grupos creados.</p>`;
      body.innerHTML = `
        <label>Selecciona tu sección</label>
        <div class="grupo-select-list">${listHtml}</div>
        <div class="field">
          <label>Contraseña de acceso del grupo</label>
          ${this.passField('grpPass', '••••••••')}
        </div>
        <button class="btn btn-primary" id="btnGrupoLogin" style="width:100%" ${grupoSeleccionado?'':'disabled'}>Ingresar como grupo ${ICONS.arrowRight}</button>
      `;
      body.querySelectorAll('.grupo-opt').forEach(node => {
        node.onclick = () => { this.state.grupoSeleccionado = node.dataset.id; this.render(); };
      });
      const btn = document.getElementById('btnGrupoLogin');
      if(btn) btn.onclick = () => {
        this.loginError = '';
        this.verificarLogin('grupo', { grupoId: this.state.grupoSeleccionado, password: document.getElementById('grpPass').value });
      };
    }

    this.root.querySelectorAll('.tabbar button').forEach(b => {
      b.onclick = () => { this.state.loginTab = b.dataset.tab; this.loginError=''; this.render(); };
    });
  }

  renderAdminShell(){
    const pendientesCount = this.state.reportes.filter(r => r.estado === 'pendiente').length;
    const tabs = [
      {id:'revisar', label:'Revisar', icon:ICONS.revisar, count: pendientesCount},
      {id:'calendario', label:'Calendario', icon:ICONS.calendario},
      {id:'historial', label:'Historial', icon:ICONS.historial},
      {id:'grupos', label:'Grupos', icon:ICONS.grupos},
      {id:'accesos', label:'Accesos', icon:ICONS.accesos},
      {id:'ajustes', label:'Ajustes', icon:ICONS.ajustes},
      {id:'vision', label:'Visión real', icon:ICONS.vision},
    ];
    this.root.innerHTML = `
      <div class="shell">
        <aside class="sidebar">
          ${this.brandBlock()}
          <nav>
            ${tabs.map(t => `
              <div class="nav-item ${this.state.tabAdmin===t.id?'active':''}" data-tab="${t.id}">
                ${t.icon}<span>${t.label}</span>
                ${t.count ? `<span class="nav-count">${t.count}</span>` : ''}
              </div>`).join('')}
          </nav>
          <div class="sidebar-foot">
            <p class="sess-tag">MODO: ADMINISTRADOR</p>
            <div class="nav-item" id="btnLogout">${ICONS.salir}<span>Cerrar sesión</span></div>
            <div style="padding:10px 8px 0;">${this.infoBadge()}</div>
          </div>
        </aside>

  /* ---------- Generación compartida del calendario (admin + público) ---------- */
  grupoNombrePorId(id){
    return this.state.grupos.find(g => g.id === id)?.nombre || 'Grupo eliminado';
  }

  reportesAprobadosEn(y, m, d){
    return this.state.reportes
      .filter(r => {
        if(r.estado !== 'aprobado') return false;
        const f = r.fecha?.toDate ? r.fecha.toDate() : (r.fecha ? new Date(r.fecha) : null);
        if(!f) return false;
        return f.getFullYear() === y && f.getMonth() === m && f.getDate() === d;
      })
      .sort((a,b) => this.grupoNombrePorId(a.grupo_id).localeCompare(this.grupoNombrePorId(b.grupo_id)));
  }

  calGridHTML(anio, mes){
    const primerDiaSemana = new Date(anio, mes, 1).getDay();
    const diasEnMes = new Date(anio, mes + 1, 0).getDate();
    const hoy = new Date(); hoy.setHours(0,0,0,0);

    let celdas = '';
    for(let i = 0; i < primerDiaSemana; i++){
      celdas += `<div class="cal-cell blank"></div>`;
    }
    for(let dia = 1; dia <= diasEnMes; dia++){
      const fechaCelda = new Date(anio, mes, dia);
      const dow = fechaCelda.getDay();
      const esFinde = (dow === 0 || dow === 6);
      const attrs = `data-dia="${dia}" data-mes="${mes}" data-anio="${anio}"`;

      if(esFinde){
        celdas += `<div class="cal-cell finde" ${attrs}><span class="cal-daynum">${dia}</span></div>`;
        continue;
      }
      const reportes = this.reportesAprobadosEn(anio, mes, dia);
      if(reportes.length){
        const nombres = reportes.map(r => this.grupoNombrePorId(r.grupo_id));
        const tag = reportes.length === 1 ? esc(nombres[0]) : `${reportes.length} equipos`;
        celdas += `
          <div class="cal-cell completado" ${attrs} title="${esc(nombres.join(', '))}">
            ${reportes.length > 1 ? `<span class="cal-multi">×${reportes.length}</span>` : ''}
            <span class="cal-daynum">${dia}</span>
            <span class="cal-tag">${tag}</span>
          </div>`;
      } else if(fechaCelda.getTime() > hoy.getTime()){
        celdas += `
          <div class="cal-cell futuro" ${attrs}>
            <span class="cal-daynum">${dia}</span>
            <span class="cal-tag">Próximo</span>
          </div>`;
      } else {
        celdas += `
          <div class="cal-cell pendiente" ${attrs}>
            <span class="cal-daynum">${dia}</span>
            <span class="cal-tag">Sin reporte</span>
          </div>`;
      }
    }
    return celdas;
  }

  calLegendHTML(){
    return `
      <div class="cal-legend">
        <span><i style="background:#2E9678;"></i> Completado</span>
        <span><i style="background:#B23A32;"></i> Sin reporte</span>
        <span><i style="background:#fff;border:1px dashed #C9D6CD;"></i> Próximo (lunes–viernes)</span>
        <span><i style="background:transparent;border:1px dashed #DDE3E1;"></i> Fin de semana</span>
      </div>`;
  }

  wireCalGrid(main, calFechaKey){
    const grid = main.querySelector('.cal-grid');
    grid.addEventListener('click', (e) => {
      const cell = e.target.closest('.cal-cell');
      if(!cell || cell.classList.contains('blank')) return;
      const dia = parseInt(cell.dataset.dia, 10);
      const mes = parseInt(cell.dataset.mes, 10);
      const anio = parseInt(cell.dataset.anio, 10);
      if(isNaN(dia)) return;
      this.abrirDetalleDia(anio, mes, dia);
    });
    main.querySelector('#btnMesAnt').onclick = () => {
      let { anio, mes } = this.state[calFechaKey];
      mes--; if(mes < 0){ mes = 11; anio--; }
      this.state[calFechaKey] = { anio, mes };
      this.render();
    };
    main.querySelector('#btnMesSig').onclick = () => {
      let { anio, mes } = this.state[calFechaKey];
      mes++; if(mes > 11){ mes = 0; anio++; }
      this.state[calFechaKey] = { anio, mes };
      this.render();
    };
  }

  /* ---------- Modal de detalle de día ---------- */
  abrirDetalleDia(anio, mes, dia){
    const fecha = new Date(anio, mes, dia);
    const dow = fecha.getDay();
    const esFinde = (dow === 0 || dow === 6);
    const reportes = this.reportesAprobadosEn(anio, mes, dia);
    this.state.modalDia = { anio, mes, dia, esFinde, reportes };
    this.renderModal();
  }

  cerrarModal(){
    this.state.modalDia = null;
    const ov = document.getElementById('modalOverlay');
    if(ov) ov.remove();
  }

  renderModal(){
    const existing = document.getElementById('modalOverlay');
    if(existing) existing.remove();
    const info = this.state.modalDia;
    if(!info) return;

    const fecha = new Date(info.anio, info.mes, info.dia);
    const diaSemana = fecha.toLocaleDateString('es-HN', { weekday:'long' });
    const fechaTitulo = `${diaSemana} ${info.dia} de ${MESES_NOMBRES[info.mes]}`;

    let etiqueta, cuerpo;
    if(info.esFinde){
      etiqueta = 'Fin de semana';
      cuerpo = `<p class="modal-empty">Este día no tiene turno de aseo asignado: el sistema opera de lunes a viernes.</p>`;
    } else if(info.reportes && info.reportes.length){
      const reportes = info.reportes;
      etiqueta = reportes.length === 1 ? 'Aseo completado' : `${reportes.length} equipos hicieron aseo`;
      cuerpo = `
        <div class="modal-status-row"><span class="badge badge-aprobado">${ICONS.check} ${reportes.length === 1 ? 'Aprobado' : `${reportes.length} reportes aprobados`}</span></div>
        ${reportes.map((r, idx) => `
          ${idx > 0 ? '<div class="divider" style="margin:18px 0;"></div>' : ''}
          <p style="font-size:14.5px;line-height:1.5;">
            <b>${esc(this.grupoNombrePorId(r.grupo_id))}</b> realizó y reportó el aseo este día.
          </p>
          <div class="modal-section">
            <h5>Tareas realizadas</h5>
            <div>${(r.tareas||[]).length ? (r.tareas||[]).map(t => `<span class="task-chip">${esc(t)}</span>`).join('') : '<span class="modal-empty">Sin tareas registradas.</span>'}</div>
          </div>
          ${r.comentarios ? `<div class="modal-comment">"${esc(r.comentarios)}"</div>` : ''}
          <p style="margin-top:16px;font-size:11.5px;color:var(--slate);font-family:var(--font-mono);">Enviado: ${fmtFecha(r.enviado_en || r.fecha)}</p>
        `).join('')}
      `;
    } else {
      const hoy = new Date(); hoy.setHours(0,0,0,0);
      const esFuturo = fecha.getTime() > hoy.getTime();
      etiqueta = esFuturo ? 'Próximo día hábil' : 'Sin reporte';
      cuerpo = esFuturo
        ? `<p class="modal-empty">Este día aún no ocurre. Cuando la sección en turno realice el aseo y su reporte sea aprobado, el detalle aparecerá aquí.</p>`
        : `<p class="modal-empty">No hay ningún reporte aprobado registrado para este día.</p>`;
    }

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'modalOverlay';
    overlay.innerHTML = `
      <div class="modal-box" role="dialog" aria-modal="true">
        <div class="modal-box-head">
          <div>
            <p class="modal-daytag">${etiqueta}</p>
            <h4 class="modal-datetitle">${fechaTitulo}</h4>
          </div>
          <button class="modal-close" id="btnCerrarModal" aria-label="Cerrar">${ICONS.xIcon}</button>
        </div>
        ${cuerpo}
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => { if(e.target === overlay) this.cerrarModal(); });
    document.getElementById('btnCerrarModal').onclick = () => this.cerrarModal();
  }

  renderVisionReal(){
    const main = document.getElementById('mainArea');
    const turnoId = this.state.ajustes?.turno_actual;
    const grupo = this.state.grupos.find(g => g.id === turnoId) || this.state.grupos[0];
    main.innerHTML = this.mainHeader('Visión real', 'Vista de la interfaz tal como la visualizan los grupos.') + `
      <div class="card" style="padding:0;overflow:hidden;">
        <div style="background:var(--ink);padding:24px;" id="previewMount"></div>
      </div>`;
    const mount = document.getElementById('previewMount');
    if(!grupo){
      mount.innerHTML = `<div class="empty-state"><h4>Nada que previsualizar</h4><p>Crea un grupo primero.</p></div>`;
      return;
    }
    mount.innerHTML = this.subViewMarkup(grupo, true);
  }

  renderSubShell(){
    const grupo = this.state.grupos.find(g => g.id === this.state.session.grupoId);
    if(!grupo){
      this.root.innerHTML = `
        <div class="login-screen">
          <div class="login-box">
            <div class="empty-state"><h4>Tu grupo ya no existe</h4><p>Contacta al administrador.</p></div>
            <div style="margin-top:16px;"><button class="btn" id="btnBack">Volver</button></div>
          </div>
        </div>`;
      document.getElementById('btnBack').onclick = () => this.logout();
      return;
    }
    this.root.innerHTML = `
      <div class="main" style="max-width:760px;margin:0 auto;">
        <div class="main-top">
          ${this.brandBlock()}
          <button class="btn btn-ghost" id="btnLogoutSub">${ICONS.salir} Salir</button>
        </div>
        <div id="subMount"></div>
        <footer class="appfoot">
          <div>Sesión activa: ${esc(grupo.nombre)}</div>
          <div style="margin-top:10px;display:flex;justify-content:center;">${this.infoBadge()}</div>
        </footer>
      </div>`;
    document.getElementById('btnLogoutSub').onclick = () => this.logout();
    document.getElementById('subMount').innerHTML = this.subViewMarkup(grupo, false);
    this.wireSubForm(grupo);
  }

  subViewMarkup(grupo, previewMode){
    const esTurno = this.state.ajustes?.turno_actual === grupo.id;
    const misReportes = this.state.reportes
      .filter(r => r.grupo_id === grupo.id)
      .slice(0, 6);
    const ahora = new Date();
    const fechaHoyISO = ahora.toISOString().slice(0,10);
    const horaAhoraISO = ahora.toTimeString().slice(0,5);

    return `
      ${this.ticketBlock(false)}
      <div style="height:20px;"></div>
      ${esTurno
        ? `<div class="banner banner-mint">${ICONS.broom} Hoy le toca el aseo a <b>&nbsp;${esc(grupo.nombre)}</b>. Envía tu reporte al terminar.</div>`
        : `<div class="banner banner-amber">${ICONS.check} Hoy no es el turno de <b>&nbsp;${esc(grupo.nombre)}</b>, pero puedes enviar un reporte si realizaste aseo.</div>`
      }

      <div class="card" style="padding:22px;margin-bottom:22px;">
        ${this.integrantesBlock(grupo, !previewMode)}
      </div>

      <div class="card" style="padding:22px;margin-bottom:22px;">
        <h3 style="font-size:16px;margin-bottom:14px;">Enviar reporte de aseo</h3>
        <label>Fecha y hora del aseo</label>
        <div class="grid-2" style="margin-bottom:16px;">
          <input type="date" id="fechaAseoInput" value="${fechaHoyISO}" ${previewMode?'disabled':''}>
          <input type="time" id="horaAseoInput" value="${horaAhoraISO}" ${previewMode?'disabled':''}>
        </div>
        <label>Tareas realizadas</label>
        <div class="checklist" id="checklistTareas">
          ${TAREAS_DISPONIBLES.map((t,i) => `
            <label class="check-item" data-i="${i}">
              <input type="checkbox" value="${esc(t)}" ${previewMode?'disabled':''}>
              <span>${esc(t)}</span>
            </label>`).join('')}
        </div>
        <div class="field" style="margin-top:16px;">
          <label>Comentarios adicionales</label>
          <textarea id="comentarioTxt" placeholder="Notas para el administrador…" ${previewMode?'disabled':''}></textarea>
        </div>
        <button class="btn btn-primary" id="btnEnviarReporte" style="width:100%;margin-top:6px;" ${previewMode?'disabled':''}>
          ${ICONS.send} Enviar reporte
        </button>
      </div>

      <h3 style="font-size:15px;margin-bottom:12px;">Tus reportes recientes</h3>
      ${misReportes.length ? misReportes.map(r => `
        <div class="report-row">
          <div>
            <div class="rmeta">
              <span class="badge badge-${r.estado}">${r.estado}</span>
              <span class="rdate">${fmtFecha(r.fecha)}</span>
            </div>
            <div>${(r.tareas||[]).map(t => `<span class="task-chip">${esc(t)}</span>`).join('')}</div>
          </div>
        </div>`).join('') : `<div class="empty-state"><h4>Sin reportes todavía</h4><p>Tu historial aparecerá aquí.</p></div>`}
    `;
  }

  wireSubForm(grupo){
    this.wireIntegrantes(document, grupo);
    const boxes = () => Array.from(document.querySelectorAll('#checklistTareas input[type=checkbox]'));
    boxes().forEach(b => {
      b.addEventListener('change', () => {
        b.closest('.check-item').classList.toggle('checked', b.checked);
      });
    });
    const btn = document.getElementById('btnEnviarReporte');
    if(!btn) return;
    btn.onclick = async () => {
      const tareas = boxes().filter(b => b.checked).map(b => b.value);
      const comentarios = document.getElementById('comentarioTxt').value;
      const fechaStr = document.getElementById('fechaAseoInput').value;
      const horaStr = document.getElementById('horaAseoInput').value || '00:00';
      if(!fechaStr){
        this.toast('Indica el día en que se realizó el aseo.', true);
        return;
      }
      const fechaHora = new Date(`${fechaStr}T${horaStr}:00`);
      btn.disabled = true;
      const ok = await this.enviarReporte(grupo.id, tareas, comentarios, fechaHora);
      btn.disabled = false;
      if(ok){
        document.getElementById('comentarioTxt').value = '';
        boxes().forEach(b => { b.checked = false; b.closest('.check-item').classList.remove('checked'); });
      }
    };
  }
}

window.semedApp = new SemedApp(firebaseConfig);
</script>
</body>
</html>
